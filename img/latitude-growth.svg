<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" width="620" height="390" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
          .axis{stroke:#94a3b8;stroke-width:1.5}
          .grid{stroke:#e2e8f0;stroke-width:1}
          .tick{font-size:12px;fill:#64748b}
          .axlbl{font-size:14px;fill:#334155}
          .euc{fill:none;stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:7 6}
          .hyp{fill:none;stroke:#f59e0b;stroke-width:3}
          .leg{font-size:13px}
        </style>
<line class="grid" x1="70" y1="320" x2="570" y2="320"/>
<text class="tick" x="60" y="324" text-anchor="end">0</text>
<line class="grid" x1="70" y1="236.92" x2="570" y2="236.92"/>
<text class="tick" x="60" y="240.92" text-anchor="end">20</text>
<line class="grid" x1="70" y1="153.85" x2="570" y2="153.85"/>
<text class="tick" x="60" y="157.85" text-anchor="end">40</text>
<line class="grid" x1="70" y1="70.77" x2="570" y2="70.77"/>
<text class="tick" x="60" y="74.77" text-anchor="end">60</text>
<line class="grid" x1="236.67" y1="320" x2="236.67" y2="50"/>
<text class="tick" x="236.67" y="338" text-anchor="middle">1</text>
<line class="grid" x1="403.33" y1="320" x2="403.33" y2="50"/>
