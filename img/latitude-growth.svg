<line class="axis" x1="70" y1="320" x2="70" y2="50"/>
<polyline class="euc" points="70,320 153.33,306.95 236.67,293.9 320,280.85 403.33,267.8 486.67,254.75 570,241.7"/><polyline class="hyp" points="70,320 153.33,306.4 236.67,289.33 320,264.43 403.33,225.34 486.67,162.09 570,58.54"/>
<text class="axlbl" x="320.0" y="372" text-anchor="middle">radius r</text>
<text class="axlbl" x="18" y="185.0" text-anchor="middle" transform="rotate(-90 18 185.0)">circumference C</text>
<line class="hyp" x1="360" y1="70" x2="400" y2="70"/><text class="leg" x="410" y="74" fill="#b45309">C = 2&#960; sinh r  (hyperbolic)</text>
<line class="euc" x1="360" y1="94" x2="400" y2="94"/><text class="leg" x="410" y="98" fill="#64748b">C = 2&#960;r  (flat)</text>
